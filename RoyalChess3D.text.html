function doNode(n){if(n.nodeType==3){const v=n.nodeValue;if(!v||!v.trim())return;const nv=tr(v);if(nv!==v){const o=TXT.get(n);if(!o||o.en!==v)TXT.set(n,{vi:v,en:nv});n.nodeValue=nv}}
